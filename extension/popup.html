<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIDE-OS</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      <h1>AIDE-OS</h1>
    </div>
    <span class="version">v1.0.0</span>
  </header>

  <main>
    <!-- Product Info -->
    <section id="product-section" class="hidden">
      <div class="product-card">
        <img id="product-image" src="" alt="Product" />
        <div class="product-details">
          <p id="product-platform" class="platform-badge"></p>
          <h2 id="product-title"></h2>
          <p id="product-price" class="price"></p>
          <p id="product-id" class="id-label"></p>
        </div>
      </div>
    </section>

    <!-- Empty State -->
    <section id="empty-state">
      <div class="empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2d3148" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <p>No product detected</p>
        <span>Navigate to an Amazon.in or Flipkart product page to get started.</span>
      </div>
    </section>

    <!-- Actions -->
    <section id="actions" class="hidden">
      <button id="btn-chipflation" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        Check Chipflation Risk
      </button>
      <button id="btn-watchlist" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
        </svg>
        Add to Watchlist
      </button>
    </section>

    <!-- Chipflation Result -->
    <section id="result-section" class="hidden">
      <div class="result-card">
        <div class="result-header">
          <span class="result-label">Decision Index</span>
          <span id="result-score" class="result-score"></span>
        </div>
        <div class="result-bar-track">
          <div id="result-bar" class="result-bar-fill"></div>
        </div>
        <div class="result-breakdown">
          <div class="metric">
            <span class="metric-label">Risk Level</span>
            <span id="metric-risk" class="metric-value"></span>
          </div>
          <div class="metric">
            <span class="metric-label">Price Trend</span>
            <span id="metric-trend" class="metric-value"></span>
          </div>
          <div class="metric">
            <span class="metric-label">Market Signal</span>
            <span id="metric-signal" class="metric-value"></span>
          </div>
        </div>
        <p id="result-summary" class="result-summary"></p>
      </div>
    </section>

    <!-- Status Messages -->
    <div id="status" class="status hidden"></div>

    <!-- Loading Spinner -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span>Analyzing…</span>
    </div>
  </main>

  <footer>
    <span>AIDE-OS · Indian Market Intelligence</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
